version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Building AnswerIQ frontend - Static HTML app"
        - ls -la
  artifacts:
    baseDirectory: .
    files:
      - '**/*'
    exclude:
      - '.git/**/*'
      - '.aws-sam/**/*'
      - 'backend/**/*'
      - 'samconfig.toml'
      - 'template.yaml'
      - 'VERIFICATION.md'
  cache:
    paths: []
