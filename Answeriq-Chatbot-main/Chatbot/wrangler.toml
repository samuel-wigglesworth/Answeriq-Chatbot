name = "answeriq-chatbot"
main = "worker.js"
compatibility_date = "2024-01-01"

# Account details (optional - wrangler will use your logged-in account)
# account_id = "your_account_id_here"

# Development mode - set to false for production
workers_dev = true

# Routes (optional - for custom domains)
# routes = [
#   { pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# Environment variables (public, non-sensitive)
[vars]
# Add any public config here
# ENVIRONMENT = "production"

# Secrets (use wrangler secret put GEMINI_API_KEY to set securely)
# GEMINI_API_KEY is set via: wrangler secret put GEMINI_API_KEY

# Usage model (optional - "bundled" is default free tier)
# usage_model = "bundled"  # 100,000 requests/day free

# Limits (optional)
# [limits]
# cpu_ms = 50  # Max CPU time per request

# Observability (optional - for monitoring)
# [observability]
# enabled = true

# ============================================================================
# SETUP INSTRUCTIONS
# ============================================================================
# 
# 1. Deploy: wrangler deploy
# 2. Set API key (optional): wrangler secret put GEMINI_API_KEY
# 3. View logs: wrangler tail answeriq-chatbot
# 4. Local dev: wrangler dev
#
# For detailed instructions, see CLOUDFLARE_DEPLOYMENT.md
