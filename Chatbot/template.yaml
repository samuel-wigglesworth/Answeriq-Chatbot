AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AnswerIQ - Python subjective answer evaluator with AI enhancements (Gemini and Amazon Bedrock)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12

Parameters:
  GeminiApiKey:
    Type: String
    Default: 'NONE'
    Description: Optional Gemini API key for AI-enhanced suggestions

  AWSBedrockRegion:
    Type: String
    Default: 'NONE'
    Description: Optional AWS region for Amazon Bedrock (e.g., us-east-1, us-west-2)

Resources:
  EvaluateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: answeriq-evaluate
      CodeUri: backend/
      Handler: lambda_handler.handler
      Architectures:
        - x86_64
      Description: Scores subjective answers using scikit-learn with AI enhancements
      Environment:
        Variables:
          GEMINI_API_KEY: !Ref GeminiApiKey
          AWS_BEDROCK_REGION: !Ref AWSBedrockRegion
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

Outputs:
  FunctionUrl:
    Description: Paste this URL into AnswerIQ Settings
    Value: !GetAtt EvaluateFunctionUrl.FunctionUrl
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt EvaluateFunction.Arn
